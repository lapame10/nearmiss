<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkyReport — Community safety intelligence for free flight</title>
<meta name="description" content="Reports, patterns and signals for paragliding and free flight. Information for pilots, not a verdict.">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icono-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SkyReport">
<meta name="theme-color" content="#f6f4f0">

<link rel="stylesheet" href="srs/styles.css">
</head>
<body>

<!-- ===== CABECERA ===== -->
<header class="top">
  <div class="top-in">
    <a class="marca" href="#inicio">
      <img src="logo.png" alt="" class="marca-ic" width="28" height="28">
      SkyReport
    </a>
    <nav>
      <a href="#inicio"   data-ir="inicio"><span data-i18n="nav.home">Home</span></a>
      <a href="#mapa"     data-ir="mapa"><span data-i18n="nav.map">Map</span></a>
      <a href="#reportar" data-ir="reportar"><span data-i18n="nav.report">Report</span></a>
      <a href="#senales"  data-ir="senales"><span data-i18n="nav.signals">Signals</span></a>
      <a href="#sitios"   data-ir="sitios"><span data-i18n="nav.sites">Sites</span></a>
      <a href="#metodo"   data-ir="metodo"><span data-i18n="nav.methodology">Methodology</span></a>
    </nav>
    <div class="acciones">
      <select class="sel-idioma" id="selIdioma" title="Language"></select>
      <button class="btn gh oculto" id="bSincroniza" title="Sync">↻</button>
      <button class="btn pri" id="bReportar" data-i18n="home.reportEvent">Report an event</button>
    </div>
  </div>
</header>

<!-- ===== ESTADO DE LA RED (demo, sin conexión, pendientes) ===== -->
<div class="estado-red" id="estadoRed"></div>

<!-- ===== CONTENIDO ===== -->
<main id="app" class="vista on"></main>

<!-- ===== BARRA INFERIOR (movil) ===== -->
<nav class="tabbar">
  <a href="#inicio" data-ir="inicio">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    <span data-i18n="nav.home">Home</span></a>
  <a href="#mapa" data-ir="mapa">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 3 3 5.5v15L9 18l6 3 6-2.5v-15L15 6Z"/><path d="M9 3v15"/><path d="M15 6v15"/></svg>
    <span data-i18n="nav.map">Map</span></a>
  <a href="#reportar" data-ir="reportar" class="tab-report">
    <span class="tab-ic">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
         stroke-linecap="round" aria-hidden="true">
      <path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </span>
    <span data-i18n="nav.report">Report</span></a>
  <a href="#senales" data-ir="senales">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 17l5-6 4 4 4-6 5 5"/><path d="M3 21h18"/></svg>
    <span data-i18n="nav.signals">Signals</span></a>
  <a href="#sitios" data-ir="sitios">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>
    <span data-i18n="nav.sites">Sites</span></a>
</nav>

<!-- ===== AVISO ===== -->
<div id="aviso" role="status" aria-live="polite"></div>

<!-- ===== AVISO DE VERSIÓN NUEVA ===== -->
<div class="actualiza oculto" id="actualiza">
  <span id="actualizaTxt" data-i18n="update.available">A new version of SkyReport is available.</span>
  <button class="btn pri" id="bActualiza" data-i18n="update.refresh">Refresh</button>
</div>

<script type="module">
  import { arranca, ir } from './srs/app.js';

  /* el boton de la cabecera y el enlace de la barra inferior */
  document.getElementById('bReportar').onclick = () => ir('reportar');
  document.querySelectorAll('.top nav a, .tabbar a').forEach(a => {
    a.onclick = (e) => { e.preventDefault(); ir(a.dataset.ir); };
  });

  arranca();

  /* ===== LA NAVEGACION DE LA CABECERA =====
     Estaba escrita en el HTML y por eso se quedaba siempre en ingles,
     aunque cambiaras de idioma. Ahora lleva data-i18n y se traduce. */
  import('./srs/i18n.js').then(m => {
    m.traducePantalla(document);
    /* el boton de la cabecera tambien */
    const b = document.getElementById('bReportar');
    if (b) b.textContent = m.t('home.reportEvent');
    const sel = document.getElementById('selIdioma');
    if (sel) sel.title = m.t('nav.language');
  });

  /* ===== AVISO DE VERSIÓN NUEVA =====
     Cuando el service worker tiene una versión esperando, se avisa y
     se ofrece recargar. Sin esto, alguien puede quedarse semanas con
     el index.html viejo en caché y no enterarse nunca. */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      const muestra = (w) => {
        if (!w) return;
        const caja = document.getElementById('actualiza');
        if (caja) caja.classList.remove('oculto');
        const b = document.getElementById('bActualiza');
        if (b) b.onclick = () => {
          w.postMessage({ tipo: 'SALTA_YA' });
          w.addEventListener('statechange', () => location.reload());
          setTimeout(() => location.reload(), 900);
        };
      };
      if (reg.waiting) muestra(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (w) w.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller) muestra(w);
        });
      });
    }).catch(() => {});
  }
</script>

</body>
</html>
