<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkyReport — Community safety intelligence for free flight</title>
<meta name="description" content="Reports, patterns and signals for paragliding and free flight. Information for pilots, not a verdict.">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SkyReport">
<meta name="theme-color" content="#f6f4f0">

<link rel="stylesheet" href="srs/styles.css">
</head>
<body>

<!-- ===== CABECERA ===== -->
<header class="top">
  <div class="top-in">
    <a class="marca" href="#inicio">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M13 2 L23.4 8 V18 L13 24 L2.6 18 V8 Z" fill="#2c4a6e"/>
        <path d="M6 13 L13 9 L20 13" stroke="#f6f4f0" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="13" cy="16.6" r="1.7" fill="#f6f4f0"/>
      </svg>
      SkyReport
    </a>
    <nav>
      <a href="#inicio"   data-ir="inicio">Home</a>
      <a href="#mapa"     data-ir="mapa">Map</a>
      <a href="#reportar" data-ir="reportar">Report</a>
      <a href="#senales"  data-ir="senales">Signals</a>
      <a href="#sitios"   data-ir="sitios">Sites</a>
      <a href="#metodo"   data-ir="metodo">Methodology</a>
    </nav>
    <div class="acciones">
      <button class="btn pri" id="bReportar">Report incident</button>
    </div>
  </div>
</header>

<!-- ===== CONTENIDO ===== -->
<main id="app" class="vista on"></main>

<!-- ===== BARRA INFERIOR (movil) ===== -->
<nav class="tabbar">
  <a href="#inicio" data-ir="inicio">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    Home</a>
  <a href="#mapa" data-ir="mapa">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 3 3 5.5v15L9 18l6 3 6-2.5v-15L15 6Z"/><path d="M9 3v15"/><path d="M15 6v15"/></svg>
    Map</a>
  <a href="#reportar" data-ir="reportar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 5v14"/><path d="M5 12h14"/></svg>
    Report</a>
  <a href="#senales" data-ir="senales">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 17l5-6 4 4 4-6 5 5"/><path d="M3 21h18"/></svg>
    Signals</a>
  <a href="#sitios" data-ir="sitios">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>
    Sites</a>
</nav>

<!-- ===== AVISO ===== -->
<div id="aviso" role="status" aria-live="polite"></div>

<script type="module">
  import { arranca, ir } from './srs/app.js';

  /* el boton de la cabecera y el enlace de la barra inferior */
  document.getElementById('bReportar').onclick = () => ir('reportar');
  document.querySelectorAll('.top nav a, .tabbar a').forEach(a => {
    a.onclick = (e) => { e.preventDefault(); ir(a.dataset.ir); };
  });

  arranca();
</script>

</body>
</html>
